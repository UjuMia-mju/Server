name: Deploy Game Server

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Existing Server
        shell: powershell
        run: |
          $processName = "GameServer"
          $process = Get-Process $processName -ErrorAction SilentlyContinue
          
          if ($process) {
              Write-Host "Found running process: $processName. Stopping..."
              Stop-Process -Name $processName -Force
              
              Write-Host "Waiting 5 seconds for file lock to release..."
              Start-Sleep -Seconds 5
          } else {
              Write-Host "No running process found."
          }

      - name: Deploy Executable
        shell: powershell
        run: |
          $sourceFile = "${{ github.workspace }}\Binary\Release\GameServer.exe"
          $destPath = "C:\Users\Administrator\Desktop\Server"
          
          if (!(Test-Path $destPath)) { 
              New-Item -ItemType Directory -Path $destPath -Force 
          }
          
          Write-Host "Copying: $sourceFile -> $destPath"
          Copy-Item -Path $sourceFile -Destination $destPath -Force

      - name: Start Server
        shell: powershell
        run: |
          $taskName = "RunGameServer"
          $exePath = "C:\Users\Administrator\Desktop\Server\GameServer.exe"
          $workDir = "C:\Users\Administrator\Desktop\Server"

          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue

          $action = New-ScheduledTaskAction -Execute $exePath -WorkingDirectory $workDir
          $principal = New-ScheduledTaskPrincipal -UserId "Administrator" -LogonType Interactive
          
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force

          Start-ScheduledTask -TaskName $taskName
          
          Write-Host "Server process started in interactive session."