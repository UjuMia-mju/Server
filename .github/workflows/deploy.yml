name: Deploy Game Server (Pre-built)

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. GitHub에 올라온 최신 파일들을 러너 폴더로 내려받기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 기존 서버 종료 (실행 중인 경우)
      - name: Stop Existing Server
        shell: powershell
        run: |
          $process = Get-Process "Server" -ErrorAction SilentlyContinue
          if ($process) {
              Stop-Process -Name "Server" -Force
              Start-Sleep -Seconds 2
          }

      # 3. 배포 폴더로 파일 복사
      # Binary/Release 폴더 안에 있는 모든 내용을 바탕화면 Server 폴더로 복사합니다.
      - name: Deploy Files
        shell: powershell
        run: |
          $sourcePath = "${{ github.workspace }}\Binary\Release\*"
          $destPath = "C:\Users\Administrator\Desktop\Server"
          
          # 목적지 폴더가 없으면 생성
          if (!(Test-Path $destPath)) { New-Item -ItemType Directory -Path $destPath }
          
          # 파일 복사 (-Recurse: 하위폴더 포함, -Force: 덮어쓰기)
          Copy-Item -Path $sourcePath -Destination $destPath -Recurse -Force

      # 4. 서버 재실행
      - name: Start Server
        shell: powershell
        run: |
          cd "C:\Users\Administrator\Desktop\Server"
          Start-Process "run.bat"