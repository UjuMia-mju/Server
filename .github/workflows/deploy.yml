name: Game Server Auto Deploy

# dev 브랜치에 코드가 push될 때 이 작업이 시작됩니다.
on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    # EC2에 설치한 러너를 사용합니다.
    runs-on: self-hosted

    steps:
      # 1. 깃허브 레포지토리의 코드를 EC2 러너로 가져옵니다.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. MSBuild 환경을 설정합니다.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. 솔루션 파일을 빌드합니다. (Release 모드, x64 아키텍처)
      - name: Build Solution
        run: msbuild Server.sln /p:Configuration=Release /p:Platform=x64

      # 4. 빌드된 파일을 바탕화면의 Server 폴더로 배포합니다.
      - name: Deploy to Desktop
        shell: powershell
        run: |
          # --- 설정 구간 ---
          $serverName = "GameServer"  # 프로세스 이름 (확장자 제외)
          $exeName = "GameServer.exe" # 실제 실행 파일명
          $targetDir = "C:\Users\Administrator\Desktop\Server"
          
          # 빌드 결과물 경로 (VS 프로젝트 설정에 따라 다를 수 있으니 확인 필수)
          $buildResultPath = "x64\Release\$exeName"
          # -----------------

          Write-Host "--- 배포 프로세스 시작 ---"

          # A. 기존 서버가 실행 중이면 종료 (파일 덮어쓰기 위해 필수)
          Write-Host "1. 기존 서버 종료 확인 중..."
          $process = Get-Process -Name $serverName -ErrorAction SilentlyContinue
          if ($process) {
              Write-Host "실행 중인 서버를 종료합니다."
              Stop-Process -Name $serverName -Force
              Start-Sleep -Seconds 3 # 완전히 종료될 때까지 대기
          }

          # B. 빌드된 .exe 파일을 바탕화면 폴더로 복사
          Write-Host "2. 파일 복사 중: $buildResultPath -> $targetDir"
          if (Test-Path $buildResultPath) {
              Copy-Item -Path $buildResultPath -Destination "$targetDir\$exeName" -Force
          } else {
              Write-Error "빌드 결과물($buildResultPath)을 찾을 수 없습니다! 경로를 확인하세요."
              exit 1
          }

          # C. 서버 재실행 (run.bat 실행)
          Write-Host "3. 서버 재시작 중..."
          if (Test-Path "$targetDir\run.bat") {
              cd $targetDir
              # Start-Process를 써야 워크플로우가 종료되지 않고 서버가 계속 돌아갑니다.
              Start-Process -FilePath "run.bat"
              Write-Host "배포 완료!"
          } else {
              Write-Error "run.bat 파일을 찾을 수 없습니다. 바탕화면 Server 폴더에 만들어주세요."
              exit 1
          }