name: Gemini AI Code Reviewer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    # PR에 달린 댓글이면서, 내용에 '/gemini-review'가 포함될 때만 실행됩니다.
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/gemini-review')
    
    steps:
      - name: PR Info
        run: |
          echo "Comment: ${{ github.event.comment.body }}"
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Details
        id: pr
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "head_sha=$(echo $PR_JSON | jq -r .head.sha)" >> $GITHUB_OUTPUT
          echo "base_sha=$(echo $PR_JSON | jq -r .base.sha)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gemini AI Code Review
        # 포크하신 본인 계정 주소를 사용하세요!
        uses: YoonB-dev/gemini-ai-code-reviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-1.5-flash"
          EXCLUDE: "*.md, *.txt, *.yml, *.yaml, .gitignore, *.sln, *.vcxproj"
          # ★ 여기에 C++ 서버 전문가 프롬프트를 넣습니다 ★
          CUSTOM_PROMPT: |
            당신은 20년 경력의 고성능 네트워크 서버 엔진 전문 개발자이자 소프트웨어 아키텍트입니다. 
            주로 C++와 IOCP(Input/Output Completion Port)를 사용하여 수만 명의 동시 접속자를 처리하는 서버를 설계합니다. 

            다음 기준에 따라 Pull Request 코드를 아주 엄격하고 꼼꼼하게 리뷰하세요:
            1. 메모리 및 포인터 안전성: 스마트 포인터 적절성, 메모리 풀링 적용 가능성 체크.
            2. 멀티스레딩 및 동기화: IOCP 워커 스레드 경합 조건 및 데드락 가능성 추적.
            3. 보안 취약점: 패킷 역직렬화 시 버퍼 오버플로우 및 외부 입력값 검증.
            4. 디자인 패턴: SOLID 원칙 준수 여부 및 현업 수준의 구조 제안.

            리뷰는 한국어로 작성하며, 수정이 필요한 부분은 반드시 구체적인 "코드 예시"를 포함하여 설명하세요.
